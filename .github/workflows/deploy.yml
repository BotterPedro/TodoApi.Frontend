name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor
        run: dotnet publish -c Release -o release

      - name: Rewrite base href para o repositório
        run: |
          sed -i 's|<base href="/" />|<base href="/TodoApi.Frontend/" />|g' release/wwwroot/index.html

      - name: Criar alias blazor.webassembly.js
        run: |
          cd release/wwwroot/_framework
          BLAZOR_FILE=$(ls blazor.webassembly.*.js 2>/dev/null | grep -v '\.br$\|\.gz$' | head -1)
          if [ -n "$BLAZOR_FILE" ] && [ ! -f "blazor.webassembly.js" ]; then
            echo "Copiando $BLAZOR_FILE para blazor.webassembly.js"
            cp "$BLAZOR_FILE" "blazor.webassembly.js"
          fi

      - name: Garantir .nojekyll no output
        run: touch release/wwwroot/.nojekyll

      - name: Copiar index.html para 404.html (SPA fallback)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact (inclui arquivos ocultos)
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4