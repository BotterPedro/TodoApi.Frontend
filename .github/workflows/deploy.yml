name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor
        run: dotnet publish -c Release -o release

      - name: Rewrite base href para o repositório
        run: |
          sed -i 's|<base href="/" />|<base href="/TodoApi.Frontend/" />|g' release/wwwroot/index.html

      - name: Criar aliases para arquivos com hash
        run: |
          cd release/wwwroot/_framework
          find . -maxdepth 1 -type f \( -name "*.js" -o -name "*.wasm" -o -name "*.dat" \) | while read f; do
            f=$(basename "$f")
            case "$f" in
              *.br|*.gz) continue ;;
            esac
            if [[ "$f" =~ ^(.+)\.([a-z0-9]{8,})\.(js|wasm|dat)$ ]]; then
              base="${BASH_REMATCH[1]}"
              ext="${BASH_REMATCH[3]}"
              target="${base}.${ext}"
              if [ ! -f "$target" ]; then
                cp "$f" "$target"
                echo "Alias criado: $f -> $target"
              fi
            fi
          done

      - name: Garantir .nojekyll no output
        run: touch release/wwwroot/.nojekyll

      - name: Copiar index.html para 404.html (SPA fallback)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact (inclui arquivos ocultos)
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4